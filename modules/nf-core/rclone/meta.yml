name: "rclone"
description: Copy data using Rclone to a specified output path
keywords:
  - rclone
  - copy
  - sync
  - data-transfer
tools:
  - "rclone":
      description: Rclone is a command line program to manage files on cloud storage
      homepage: "https://rclone.org/"
      documentation: "https://rclone.org/docs/"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - source_path:
        type: path
        description: Source path to copy from (can be local or remote path)
  - destination_path:
      type: string
      description: |
        Destination base path where data will be copied to. Sample ID will be appended.
        Can be local path or remote storage path (s3://, gs://, etc.)
output:
  copy_status:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - copy_status:
          type: string
          description: Status of the copy operation (success/failed)
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rclone:
          type: string
          description: The name of the tool
      - "*.version.txt":
          type: file
          description: File containing software version
