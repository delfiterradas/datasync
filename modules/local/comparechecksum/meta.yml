name: "comparechecksum"
description: |
  Compare expected checksums against generated checksums and produce
  a per-file validation report and a summary count of MATCH/MISMATCH/MISSING/UNEXPECTED statuses.
keywords:
  - checksum
  - validation
  - integrity
  - md5
  - sha256
tools:
  - "r-base":
      description: "R statistical computing language used to run the comparison logic"
      homepage: "https://www.r-project.org/"
      documentation: "https://cran.r-project.org/manuals.html"
      licence: ["GPL-2.0-or-later"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input_checksum:
        type: file
        description: |
          File containing expected checksums (two-column, space-separated:
          checksum and filename).
        pattern: "*.{md5,sha256,tsv,txt}"
    - generated_checksum:
        type: file
        description: |
          File containing observed/generated checksums in the same format
          as input_checksum.
        pattern: "*.{md5,sha256,tsv,txt}"

output:
  - report:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.csv":
          type: file
          description: |
            Per-file validation report (checksum_validation.csv) and summary
            report (checksum_summary.csv).
          pattern: "*.csv"
  - summary_report:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.csv":
          type: file
          description: |
            Per-file validation report and summary report (same glob as report channel).
          pattern: "*.csv"
  - versions_comparechecksum:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@delfiterradas"
maintainers:
  - "@delfiterradas"
