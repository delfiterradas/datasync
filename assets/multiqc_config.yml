report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/datasync/tree/dev" target="_blank">nf-core/datasync</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/datasync/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-datasync-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-datasync-summary":
    order: -1002

export_plots: false

disable_version_detection: true

custom_data:
  samplesheet:
    section_name: "Input Samplesheet"
    plot_type: "table"
    file_format: "csv"
    headers:
      sample:
        title: Sample ID
      input:
        title: Path to copy
      output_path:
        title: Destination path
      checksum_md5:
        title: MD5 checksum file
      checksum_sha:
        title: Sha256 checksum file

  rclone_checksum_md5:
    section_name: "RClone MD5 Checksum Report"
    description: "MD5 input checksum validation"
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      no_violin: true

  rclone_checksum_sha:
    section_name: "RClone SHA Checksum Report"
    description: "SHA input checksum validation"
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      no_violin: true

  rclone_check:
    section_name: "Final RClone Check Report"
    description: "Validation of copied files"
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      no_violin: true

  md5_checksum_summary:
    section_name: "MD5 Checksum Summary"
    description: "Summary of MD5 checksum validation"
    plot_type: "table"
    file_format: "csv"
    headers:
      Match:
        description: "Number of files whose output checksum matches the expected checksum."
      Mismatch:
        description: "Number of files whose output checksum differs from the expected checksum."
      Missing:
        description: "Number of expected input files that are missing from the output."
      Unexpected:
        description: "Number of output files that were not present in the input checksum list."

  sha_checksum_summary:
    section_name: "SHA Checksum Summary"
    description: "Summary of SHA checksum validation"
    plot_type: "table"
    file_format: "csv"
    headers:
      Match:
        description: "Number of files whose output checksum matches the expected checksum."
      Mismatch:
        description: "Number of files whose output checksum differs from the expected checksum."
      Missing:
        description: "Number of expected input files that are missing from the output."
      Unexpected:
        description: "Number of output files that were not present in the input checksum list."

  md5_checksum_report:
    section_name: "MD5 Checksum Report"
    description: "Detailed MD5 checksum validation report"
    plot_type: "table"
    file_format: "csv"
    pconfig:
      no_violin: true
    headers:
      File:
        title: File
        description: "Path to the file being validated."
      checksum_expected:
        title: Expected checksum
        description: "Checksum recorded for the input file before processing."
      checksum_observed:
        title: Observed checksum
        description: "Checksum calculated for the corresponding output file after processing."
      status:
        title: Status
        description: "Comparison result between the expected and observed checksums."

  sha_checksum_report:
    section_name: "SHA Checksum Report"
    description: "Detailed SHA checksum validation report"
    plot_type: "table"
    file_format: "csv"
    pconfig:
      no_violin: true
    headers:
      File:
        title: File
        description: "Path to the file being validated."
      checksum_expected:
        title: Expected checksum
        description: "Checksum recorded for the input file before processing."
      checksum_observed:
        title: Observed checksum
        description: "Checksum calculated for the corresponding output file after processing."
      status:
        title: Status
        description: "Comparison result between the expected and observed checksums."

sp:
  samplesheet:
    fn: "samplesheet.csv"
  rclone_checksum_md5:
    fn: "*_md5_rclone_checksum_mqc.tsv"
  rclone_checksum_sha:
    fn: "*_sha_rclone_checksum_mqc.tsv"
  rclone_check:
    fn: "*_rclone_check_mqc.tsv"

  md5_checksum_summary:
    fn: "*_md5.checksum_summary.csv"
  sha_checksum_summary:
    fn: "*_sha.checksum_summary.csv"
  md5_checksum_report:
    fn: "*_md5.checksum_validation.csv"
  sha_checksum_report:
    fn: "*_sha.checksum_validation.csv"
