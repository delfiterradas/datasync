report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/datasync/tree/dev" target="_blank">nf-core/datasync</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/datasync/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-datasync-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-datasync-summary":
    order: -1002

export_plots: true

disable_version_detection: true

custom_data:
  md5_checksum_summary:
    section_name: "MD5 Checksum Summary"
    description: "Summary of MD5 checksum validation"
    plot_type: "table"
    file_format: "csv"

  sha_checksum_summary:
    section_name: "SHA Checksum Summary"
    description: "Summary of SHA checksum validation"
    plot_type: "table"
    file_format: "csv"

  md5_checksum_report:
    section_name: "MD5 Checksum Report"
    description: "Detailed MD5 checksum validation report"
    plot_type: "table"
    file_format: "csv"
    pconfig:
      no_violin: true

    headers:
      File:
        title: File
      checksum_expected:
        title: Expected checksum
      checksum_observed:
        title: Observed checksum
      status:
        title: Status

  sha_checksum_report:
    section_name: "SHA Checksum Report"
    description: "Detailed SHA checksum validation report"
    plot_type: "table"
    file_format: "csv"
    pconfig:
      no_violin: true

    headers:
      File:
        title: File
      checksum_expected:
        title: Expected checksum
      checksum_observed:
        title: Observed checksum
      status:
        title: Status


sp:
  md5_checksum_summary:
    fn: "*_md5.checksum_summary.csv"

  sha_checksum_summary:
    fn: "*_sha.checksum_summary.csv"

  md5_checksum_report:
    fn: "*_md5.checksum_validation.csv"

  sha_checksum_report:
    fn: "*_sha.checksum_validation.csv"
