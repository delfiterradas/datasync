report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/datasync/tree/dev" target="_blank">nf-core/datasync</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/datasync/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-datasync-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-datasync-summary":
    order: -1002

export_plots: false

disable_version_detection: true

custom_data:
  samplesheet:
    section_name: "Input Samplesheet"
    plot_type: "table"
    file_format: "csv"
    headers:
      sample:
        title: Sample ID
      input:
        title: Path to copy
      output_path:
        title: Destination path
      checksum_md5:
        title: MD5 checksum file
      checksum_sha:
        title: Sha256 checksum file

  rclone_checksum_md5:
    section_name: "MD5sum Input Validation"
    description: "Comparison of the expected MD5 checksums provided in the samplesheet with the observed MD5 checksums of the file(s) found at the specified source path."
    plot_type: "table"
    file_format: "tsv"
    headers:
      Status:
        title: Result
        description: "= Match; - Missing in source; + Missing in destination; * Mismatch; ! Error"
        cond_formatting_rules:
          match:
            - s_eq: "="
            - s_eq: "Match"
          missing_source:
            - s_eq: "-"
            - s_eq: "Missing in source"
          missing_destination:
            - s_eq: "+"
            - s_eq: "Missing in destination"
          mismatch:
            - s_eq: "*"
            - s_eq: "Mismatch"
          error:
            - s_eq: "!"
            - s_eq: "Error"
        cond_formatting_colours:
          - match: "#5cb85c"
          - missing_source: "#f0ad4e"
          - missing_destination: "#5bc0de"
          - mismatch: "#d9534f"
          - error: "#8b0000"
      File:
        title: File
        description: "File checked by rclone"
      Priority:
        title: Priority
        hidden: true
    pconfig:
      no_violin: true
      defaultsort:
        - column: Priority
          direction: asc

  rclone_checksum_sha:
    section_name: "SHAsum Input Validation"
    description: "Comparison of the expected SHA-256 checksums provided in the samplesheet with the observed SHA-256 checksums of the file(s) found at the specified source path."
    plot_type: "table"
    file_format: "tsv"
    headers:
      Status:
        title: Result
        description: "= Match; - Missing in source; + Missing in destination; * Mismatch; ! Error"
        cond_formatting_rules:
          match:
            - s_eq: "="
            - s_eq: "Match"
          missing_source:
            - s_eq: "-"
            - s_eq: "Missing in source"
          missing_destination:
            - s_eq: "+"
            - s_eq: "Missing in destination"
          mismatch:
            - s_eq: "*"
            - s_eq: "Mismatch"
          error:
            - s_eq: "!"
            - s_eq: "Error"
        cond_formatting_colours:
          - match: "#5cb85c"
          - missing_source: "#f0ad4e"
          - missing_destination: "#5bc0de"
          - mismatch: "#d9534f"
          - error: "#8b0000"
      File:
        title: File
        description: "File checked by rclone"
      Priority:
        title: Priority
        hidden: true
    pconfig:
      no_violin: true
      defaultsort:
        - column: Priority
          direction: asc

  rclone_check:
    section_name: "Source-Destination Checksum Validation"
    description: "Comparison of the checksums of corresponding file(s) in the source input path and the output destination to confirm data integrity following file transfer."
    plot_type: "table"
    file_format: "tsv"
    headers:
      Status:
        title: Result
        description: "= Match; - Missing in source; + Missing in destination; * Mismatch; ! Error"
        cond_formatting_rules:
          match:
            - s_eq: "="
            - s_eq: "Match"
          missing_source:
            - s_eq: "-"
            - s_eq: "Missing in source"
          missing_destination:
            - s_eq: "+"
            - s_eq: "Missing in destination"
          mismatch:
            - s_eq: "*"
            - s_eq: "Mismatch"
          error:
            - s_eq: "!"
            - s_eq: "Error"
        cond_formatting_colours:
          - match: "#5cb85c"
          - missing_source: "#f0ad4e"
          - missing_destination: "#5bc0de"
          - mismatch: "#d9534f"
          - error: "#8b0000"
      File:
        title: File
        description: "File checked by rclone"
      Priority:
        title: Priority
        hidden: true
    pconfig:
      no_violin: true
      defaultsort:
        - column: Priority
          direction: asc

sp:
  samplesheet:
    fn: "samplesheet.csv"
  rclone_checksum_md5:
    fn: "*_md5_rclone_checksum_mqc.tsv"
  rclone_checksum_sha:
    fn: "*_sha_rclone_checksum_mqc.tsv"
  rclone_check:
    fn: "*_rclone_check_mqc.tsv"
