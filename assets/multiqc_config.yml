report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/datasync/tree/dev" target="_blank">nf-core/datasync</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/datasync/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-datasync-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-datasync-summary":
    order: -1002

export_plots: true

disable_version_detection: true

custom_data:
  checksum_summary:
    section_name: "Checksum Summary"
    description: "Summary of checksum validation"
    plot_type: "table"
    file_format: "csv"
  checksum_report:
    section_name: "Checksum Report"
    description: "Checksum validation report"
    plot_type: "table"
    file_format: "csv"

sp:
  checksum_summary:
    fn: "*.checksum_summary.csv"
  checksum_report:
    fn: "*.checksum_validation.csv"
